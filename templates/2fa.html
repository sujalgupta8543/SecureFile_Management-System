<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Verification - SecureFS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .otp-input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 0.75rem;
            border: 2px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 1.5rem;
            letter-spacing: 0.5rem;
            text-align: center;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .otp-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            padding: 1rem;
            border-radius: 0.75rem;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Verify Identity</h1>
        <p>Scan the QR code with your Authenticator app.</p>
        
        <div id="qrcode-container" style="background: white; padding: 1rem; border-radius: 1rem; margin: 0 auto 2rem; width: fit-content; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);">
            <div id="qrcode"></div>
        </div>

        <details style="margin-bottom: 2rem; cursor: pointer;">
            <summary style="color: var(--text-muted); font-size: 0.875rem;">Can't scan? Use setup key</summary>
            <div style="background: rgba(15, 23, 42, 0.5); padding: 1rem; border-radius: 0.75rem; margin-top: 1rem; border: 1px dashed var(--primary);">
                <small style="color: var(--text-muted); display: block; margin-bottom: 0.5rem;">Authenticator Setup Secret:</small>
                <code style="font-size: 1.2rem; color: #818cf8; letter-spacing: 2px;">{{ secret }}</code>
            </div>
        </details>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/verify-2fa" method="POST">
            <input type="text" name="otp" class="otp-input" placeholder="000000" maxlength="6" required autofocus>
            <button type="submit">Verify & Continue</button>
        </form>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "{{ uri }}",
            width: 200,
            height: 200,
            colorDark : "#0f172a",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
